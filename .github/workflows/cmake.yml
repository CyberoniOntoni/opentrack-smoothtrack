name: CMake

# Disabled for now — use "Windows 11 Build" workflow instead.
# Re-enable push/pull_request when multi-platform CI is needed again.
on:
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
        - os: macos-latest
          cmake: cmake
        - os: ubuntu-latest
          cmake: cmake
        - os: windows-latest
          cmake: .\.github\workflows\build-windows.bat cmake

    steps:
    - name: clone opentrack/opentrack
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: clone opentrack/depends
      uses: actions/checkout@v4
      with:
        repository: opentrack/opentrack-depends
        submodules: true
        path: opentrack-depends

    - uses: seanmiddleditch/gha-setup-ninja@master

    - name: Install Linux Dependencies
      run: |
        sudo apt update
        sudo apt install libproc2-dev libopencv-dev libopencv-dev wine64-tools
        sudo apt install qt6-tools-dev qt6-serialport-dev qt6-base-private-dev
        sudo apt install libusb-1.0-0-dev libsdl2-dev
        # Optional: SmoothTrack iOS USB tracker (tracker-smoothtrack / PR #2101)
        sudo apt install libusbmuxd-dev || true

        mkdir /tmp/a
        wget -qO- https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-linux-x64-1.23.2.tgz  | tar --strip-components=1 -zxf - -C/tmp/a
        sudo cp -R /tmp/a/{lib,include} /usr
      if: matrix.os == 'ubuntu-latest'

    - name: Install opencv (Windows)
      uses: cvpkg/opencv-action@main
      with:
        opencv_tag: '4.x'
        BUILD_LIST: 'core,imgcodecs,imgproc,video,videoio,calib3d,highgui'
        BUILD_SHARED_LIBS: 'OFF'
        BUILD_WITH_STATIC_CRT: 'OFF'
      if: matrix.os == 'windows-latest'

    - name: Install libusbmuxd (Windows, optional)
      shell: pwsh
      run: |
        if (-not $env:VCPKG_INSTALLATION_ROOT) { Write-Host "no vcpkg; skip"; exit 0 }
        & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libusbmuxd:x64-windows
        if ($LASTEXITCODE -ne 0) { Write-Host "libusbmuxd optional install failed; continuing" }
      if: matrix.os == 'windows-latest'
      continue-on-error: true

    - name: Install opencv (macOS)
      run: brew install opencv libusbmuxd || brew install opencv
      if: matrix.os == 'macos-latest'

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        dir: "${{ github.workspace }}/qt"
        version: '6.10.3'
        modules: qtserialport qtmultimedia qtimageformats
        target: 'desktop'
        #use-official: true
      if: matrix.os != 'ubuntu-latest'

    - name: Configure (Windows)
      shell: pwsh
      run: |
        # Prefer CMAKE_PREFIX_PATH over a full vcpkg toolchain so OpenCV from
        # opencv-action is not masked. libusbmuxd (if installed) is still found.
        $extra = @()
        $vcpkgInstalled = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows"
        if ($env:VCPKG_INSTALLATION_ROOT -and (Test-Path $vcpkgInstalled)) {
          $extra += "-DCMAKE_PREFIX_PATH=$vcpkgInstalled"
        }
        $cmd = @(
          ".\.github\workflows\build-windows.bat", "cmake", "-GNinja",
          "-S", "${{ github.workspace }}/",
          "-B", "${{ github.workspace }}/build",
          "-DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}",
          "-DQt6_DIR=$env:QT_ROOT_DIR/lib/cmake/Qt6"
        ) + $extra
        & cmd.exe /c ($cmd -join ' ')
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      if: matrix.os == 'windows-latest'

    - name: Configure (Unix)
      run: ${{matrix.cmake}} -GNinja -S ${{github.workspace}}/ -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DQt6_DIR="${{env.QT_ROOT_DIR}}/lib/cmake/Qt6" -DONNXRuntime_DIR=/usr/lib/cmake/onnxruntime
      if: matrix.os != 'windows-latest'

    - name: Build
      run: ${{matrix.cmake}} --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target install

